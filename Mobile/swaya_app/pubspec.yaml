name: swaya_app
description: Swaya — body measurements from photos with an AI fit assistant.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  # 3D avatar / garment try-on (renders GLB in a WebView via <model-viewer>)
  model_viewer_plus: ^1.10.0
  webview_flutter: ^4.14.0 # mobile recolour: run JS in the model-viewer WebView
  web: ^1.1.1 # web recolour: reach the <model-viewer> element via js_interop
  # Authentication (Firebase)
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
