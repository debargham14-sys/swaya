# Render Blueprint — https://render.com/docs/blueprint-spec
# After deploy, set MONGODB_URI in the Render dashboard (Atlas connection string).
services:
  - type: web
    name: swaya-dsv-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: dsv
      - key: SCAN_STORAGE_BACKEND
        value: gridfs
      - key: BUNDLE_TRY_MESH
        value: "0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENABLE_QC
        value: "0"
      - key: SCAN_MAX_IMAGE_EDGE
        value: "1920"
      - key: POSE_SINGLE_SCALE
        value: "0"
      - key: POSE_FRONT_ONLY
        value: "0"
      - key: POSE_MIN_DETECTION_CONFIDENCE
        value: "0.35"
      - key: POSE_MASK_THRESHOLD
        value: "0.4"
      - key: GRABCUT_WORK_EDGE
        value: "768"
      - key: GRABCUT_ITERS
        value: "4"
